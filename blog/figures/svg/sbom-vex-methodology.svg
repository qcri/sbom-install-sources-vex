<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img">
<title>Methodology</title>
<desc>Four steps: hold the code fixed; vary the install route, SBOM generator, scanner and VEX application (84 results); judge each result against an exploit-based oracle; explain each error with probes that change one thing and rescan.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<circle cx="36" cy="38" r="12" fill="#2a78d6"/>
<text x="36" y="43" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="56" y="44" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Hold the code fixed</text>
<circle cx="312" cy="38" r="12" fill="#2a78d6"/>
<text x="312" y="43" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="332" y="44" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Vary the pipeline</text>
<circle cx="688" cy="38" r="12" fill="#2a78d6"/>
<text x="688" y="43" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="708" y="44" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Judge every result</text>
<circle cx="984" cy="38" r="12" fill="#2a78d6"/>
<text x="984" y="43" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1004" y="44" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Explain every error</text>
<rect x="24" y="76" width="240" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="40" y="102" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">one library</text>
<text x="40" y="124" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">PyYAML 5.3.1</text>
<rect x="24" y="152" width="240" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="40" y="178" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">one vulnerability</text>
<text x="40" y="200" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">CVE-2020-14343</text>
<rect x="24" y="228" width="240" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="40" y="254" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">one application</text>
<text x="40" y="276" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">calls yaml.full_load</text>
<text x="24" y="322" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">only 2 versions of the</text>
<text x="24" y="341" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">vulnerable file exist</text>
<rect x="300" y="76" width="340" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="316" y="99" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">7 install routes</text>
<text x="316" y="119" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">2× apt · PyPI · git · local · backport · 6.0.2</text>
<text x="470" y="144" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#52514e" text-anchor="middle">×</text>
<rect x="300" y="146" width="340" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="316" y="169" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">2 SBOM generators</text>
<text x="316" y="189" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Syft · Trivy</text>
<text x="470" y="214" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#52514e" text-anchor="middle">×</text>
<rect x="300" y="216" width="340" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="316" y="239" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">2 scanners</text>
<text x="316" y="259" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Grype · Trivy</text>
<text x="470" y="284" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#52514e" text-anchor="middle">×</text>
<rect x="300" y="286" width="340" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="316" y="309" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">3 VEX modes</text>
<text x="316" y="329" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">without VEX · --vex · vexctl filter</text>
<text x="300" y="372" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">= 84 results, 28 per VEX mode</text>
<rect x="676" y="76" width="260" height="92" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="692" y="102" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Oracle</text>
<text x="692" y="124" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">runs the exploit inside each</text>
<text x="692" y="144" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">image: vulnerable or not</text>
<path d="M806,168 L806,196" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="816" y="188" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="start">compare</text>
<rect x="676" y="206" width="44" height="32" rx="6" fill="#d8efd7" stroke="none" stroke-width="1"/>
<text x="698.0" y="228.0" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#006300" text-anchor="middle">✓</text>
<text x="730" y="227" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">agrees</text>
<rect x="676" y="250" width="44" height="32" rx="6" fill="#d03b3b" stroke="none" stroke-width="1"/>
<text x="698.0" y="271.0" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">FP</text>
<text x="730" y="271" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">reported, not vulnerable</text>
<rect x="676" y="294" width="44" height="32" rx="6" fill="#d03b3b" stroke="none" stroke-width="1"/>
<text x="698.0" y="315.0" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">FN</text>
<text x="730" y="315" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">vulnerable, not reported</text>
<rect x="972" y="76" width="204" height="268" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="988" y="102" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Probes</text>
<text x="988" y="126" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">for each error, change</text>
<text x="988" y="145" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">one thing and rescan:</text>
<text x="1000" y="174" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">· one SBOM field</text>
<text x="1000" y="196" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">· one VEX field</text>
<text x="1000" y="218" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">· the SBOM format</text>
<text x="1000" y="240" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">· where a statement</text>
<text x="1012" y="262" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">is applied</text>
<text x="988" y="300" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">→ the mechanism</text>
<text x="988" y="320" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">behind the error</text>
<path d="M266,196 L296,196" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M642,196 L672,196" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M938,272 L968,272" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="24" y="404" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Only the packaging varies, never the code, so any disagreement between results is a failure of the tools, not a difference in risk.</text>
</svg>
