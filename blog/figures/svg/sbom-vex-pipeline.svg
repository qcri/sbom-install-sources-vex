<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
<title>The experiment's pipeline</title>
<desc>Supplier side: an image goes to an SBOM generator and to an oracle that drives the VEX statement. Consumer side: a scanner reads SBOM and VEX, or a post-filter applies the VEX to SARIF; the result is compared with the oracle. Five numbered badges mark where the findings occur.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
