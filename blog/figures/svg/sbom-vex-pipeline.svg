<text x="130" y="44" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#898781" text-anchor="start">builds the image and describes it</text>
<rect x="616" y="16" width="568" height="430" rx="14" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/>
